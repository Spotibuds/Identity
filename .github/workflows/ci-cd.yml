name: Validate Identity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Identity.sln --locked-mode
      - run: dotnet build Identity.sln --no-restore --configuration Release
      - run: dotnet test tests/Identity.Tests/Identity.Tests.csproj --no-build --configuration Release
      - run: python3 scripts/check-advisories.py --self-test
      - run: dotnet list Identity.csproj package --vulnerable --include-transitive --no-restore --format json > advisory-scan.json
      - run: python3 scripts/check-advisories.py advisory-scan.json Identity.csproj
      - run: docker build -t spotibuds-identity-ci .
